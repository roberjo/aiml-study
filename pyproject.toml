[project]
name = "aiml-study"
version = "0.1.0"
description = "Self-study recreation of the UT Austin / Great Learning PG Program in AI & ML"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Data + EDA (Course 1)
    "pandas>=2.2",
    "polars>=1.0",
    "duckdb>=1.1",
    "pyarrow>=17",
    "numpy>=2.0",
    # Plotting
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "altair>=5.4",
    "plotly>=5.24",
    # Notebooks
    "marimo>=0.9",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "openai>=3.37.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = ["ruff>=0.7", "pytest>=8.3"]
# Added as the weeks arrive -- `uv sync --group ml` etc.
ml = ["scikit-learn>=1.5", "xgboost>=2.1", "lightgbm>=4.5", "shap>=0.46", "mlflow>=2.17"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.build-backend]
module-name = "aiml"

[build-system]
requires = ["uv_build>=0.5"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
